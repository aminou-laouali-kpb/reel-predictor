# =====================================================================================
#  Reel Predictor — pondérations de l'algorithme (propriété : chantier ALGORITHME)
# =====================================================================================
# Toutes les pondérations vivent ici : aucune valeur n'est codée en dur dans le pipeline.
# Les poids ROI -> indice (composante cérébrale) sont dans config/roi_mapping.yaml > indices.
# Les seuils des recommandations « quoi changer » sont dans config/rules.yaml.
# La section `retention` peut être surchargée par data/calibration.json (cf. calibrate.py).
#
# Rappel du calcul d'un indice I à la seconde t (valeurs 0..1) :
#   signal(t)  = clip(baseline + Σ booster_k · feature_k(t), 0, 1)       (features toutes en 0..1)
#   cerveau(t) = sigmoïde(gain · (Σ poids_roi · roi(t) / Σ|poids_roi| − centre))
#   I(t)       = brain_weight · cerveau(t) + (1 − brain_weight) · signal(t)   (si cerveau dispo)
#              = signal(t)                                                     (sinon)
# =====================================================================================
version: 1

# --- Échantillonnage des images ------------------------------------------------------
sampling:
  frames_fps: 4          # images/s extraites (visages + mouvement)
  ocr_fps: 1             # images/s envoyées à l'OCR (1 = une image au milieu de chaque seconde)
  frame_width: 720       # largeur max (px) des images analysées (réduction si plus large)

# --- Détection des plans (cuts) ------------------------------------------------------
scenes:
  detector: content      # content = PySceneDetect ContentDetector ; ffmpeg = filtre select(scene)
  threshold: 27.0        # seuil du ContentDetector (plus bas = plus de cuts)
  min_scene_len_s: 0.4   # durée minimale d'un plan
  ffmpeg_threshold: 0.3  # seuil du repli ffmpeg select='gt(scene,X)'

# --- Transcription (faster-whisper) --------------------------------------------------
speech:
  model: small           # tiny | base | small | medium ...
  language: auto         # auto = détection ; sinon code ISO 639-1 (fr, en ...)
  device: cpu
  compute_type: int8
  beam_size: 5
  vad_filter: true
  cpu_threads: 0         # 0 = automatique

# --- Visages (MediaPipe FaceDetector, blaze_face_short_range) ------------------------
faces:
  min_confidence: 0.5    # score minimal d'une détection

# --- OCR (RapidOCR) ------------------------------------------------------------------
ocr:
  min_score: 0.6             # on ignore les lignes reconnues sous ce score
  min_chars: 2               # on ignore les lignes plus courtes (bruit)
  same_text_similarity: 0.8  # similarité (0..1) au-delà de laquelle deux secondes affichent « le même » texte
  det_limit_side_len: 736    # taille max du côté de l'image pour la détection (vitesse)
  det_limit_type: max
  use_angle_cls: false       # classifieur d'orientation (inutile pour du texte droit)
  reuse_if_diff_below: 1.0   # si l'image a très peu changé (diff. moyenne 0..255), on réutilise l'OCR précédent

# --- Audio ---------------------------------------------------------------------------
audio:
  window_s: 0.1          # fenêtre de calcul RMS (s)
  silence_dbfs: -45.0    # silence si RMS de la seconde < ce niveau (dBFS) ...
  silence_rel: 0.06      # ... ou si RMS < cette fraction du max de la vidéo

# --- Construction des features (toutes ramenées en 0..1) -----------------------------
features:
  cut_tau_s: 1.5                 # cut_recent = exp(-(since_cut − 0,5) / tau) après un vrai cut (0 sans cut)
  since_cut_long: {start_s: 3.0, full_s: 8.0}   # 0 avant 3 s sans cut, 1 à partir de 8 s
  motion_ref: 14.0               # différence moyenne d'image (0..255, 4 i/s) qui vaut 1
  speech_rate_ref: 3.5           # débit (mots/s) qui vaut 1
  speech_rate_window_s: 3        # fenêtre glissante centrée du débit (contrat : 3 s)
  text_density_ref: 12           # nb de mots à l'écran qui vaut 1
  face_close_area: 0.10          # aire de visage (part de l'image) qui vaut 1 (gros plan)
  loud_var_window_s: 3           # fenêtre de la variance de loudness
  loud_var_ref_db: 6.0           # écart-type de loudness (dB) qui vaut 1
  loud_jump_ref_db: 10.0         # |Δ loudness| entre deux secondes (dB) qui vaut 1
  keyword_min_len: 4             # longueur min d'un mot-clé (répétition)
  keyword_repeat_ref: 2          # nb de mots-clés répétés dans la seconde qui vaut 1
  overlap_window_s: 2            # texte écran = parole si le mot est prononcé à ± N s

# Mots-clés d'appel à l'action (recherche insensible à la casse et aux accents).
# Texte à l'écran : l'OCR colle souvent les mots (« PRENDREMONGUIDE ») ; les mots-clés d'au moins 5 lettres
# sont aussi cherchés « collés » dans un mot plus long (reel_predictor/textutils.py, garde-fous anti faux positifs).
